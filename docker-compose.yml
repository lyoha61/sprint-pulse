services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sprintpulse_backend
    depends_on:
      - db
      - ollama
    ports:
      - '3000:3000'
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sprintpulse_frontend
    ports:
      - '80:80'
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: sprintpulse_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    container_name: sprintpulse_ollama
    restart: always
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data: